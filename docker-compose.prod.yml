# Hospital HRM — PRODUCTION bằng Docker
#   docker compose -f docker-compose.prod.yml up -d --build
# https://dieuduong.bvnghean.vn (reverse proxy HTTPS) → máy chủ :${WEB_PORT:-8080}
# → nginx (container frontend). Thử nhanh không qua proxy: http://localhost:8080
# (khi đó đặt COOKIE_SECURE=false, nếu không sẽ không đăng nhập được).
#
# Biến của compose đặt trong file .env cạnh file này (không commit):
#   WEB_BIND         mặc định 0.0.0.0. Proxy HTTPS ở CÙNG máy → 127.0.0.1 để máy
#                    khác trong LAN không gọi thẳng HTTP 8080; proxy ở máy khác
#                    → giữ mặc định và chặn 8080 bằng firewall, chỉ mở cho IP proxy.
#   WEB_PORT         mặc định 8080
#   TRUSTED_PROXIES  IP/CIDR của proxy HTTPS (xem client/docker/40-trusted-proxies.sh)
#
# Database: PostgreSQL cài trực tiếp trên máy host (không nằm trong compose).
# Cấu hình (DB, JWT_SECRET, COOKIE_SECURE...) đọc từ server/.env.production —
# tạo từ server/.env.production.example. Nếu không có file đó thì dùng
# server/.env (tiện chạy thử trên máy dev). Thiếu cả hai → server báo thiếu
# biến và dừng.
#
# File này là PRODUCTION. Dev (hot reload) dùng docker-compose.yml —
# project riêng "hospital_hrm_dev", không đụng tới container/volume ở đây.
# Giữ nguyên tên project: volume audit log thật là hospital_hrm_api-logs.

name: hospital_hrm

services:
  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: hospital-hrm-api:latest
    restart: unless-stopped
    # File sau ghi đè file trước. "environment" bên dưới ghi đè cả hai, nên
    # chỉ để ở đó những giá trị cố định của container — mọi cấu hình còn lại
    # (DB_HOST, COOKIE_SECURE...) đặt trong .env.production.
    env_file:
      - path: server/.env
        required: false
      - path: server/.env.production
        required: false
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      # Đúng 1 hop proxy liền trước (nginx container) — nginx đã lọc IP thật
      # theo TRUSTED_PROXIES và GHI ĐÈ X-Forwarded-For. Ghim ở đây để một dòng
      # TRUST_PROXY lạc trong .env không mở đường giả IP lách rate-limit.
      TRUST_PROXY: "1"
      # Giờ Việt Nam: file log xoay theo ngày địa phương (giống khi chạy trực tiếp trên Windows)
      TZ: Asia/Ho_Chi_Minh
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # API không mở cổng ra ngoài — chỉ nginx (web) gọi tới qua mạng nội bộ
    expose:
      - "3000"
    volumes:
      - api-logs:/app/server/logs
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  frontend:
    build:
      context: .
      dockerfile: client/Dockerfile
    image: hospital-hrm-web:latest
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8080}:80"
    # nginx chạy user 101 + cap_drop ALL vẫn bind được cổng 80
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    environment:
      # Trống = 127.0.0.1 + mạng Docker (proxy HTTPS cùng máy). Proxy ở máy
      # khác thì BẮT BUỘC đặt IP của nó, nếu không mọi người dùng bị coi là
      # cùng 1 IP (IP proxy) → rate-limit đăng nhập chặn cả viện.
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  # Nhật ký hệ thống của server (audit.YYYY-MM-DD.N.log — pino-roll)
  api-logs:
