# Hospital HRM — chạy bằng Docker
#   docker compose up -d --build
# Truy cập: http://localhost:${WEB_PORT:-8080}
#
# Database: dùng SQL Server có sẵn trên máy host (không nằm trong compose).
# Cấu hình (DB, JWT_SECRET, COOKIE_SECURE...) đọc từ server/.env.production —
# tạo từ server/.env.production.example. Nếu không có file đó thì dùng
# server/.env (tiện chạy thử trên máy dev). Thiếu cả hai → server báo thiếu
# biến và dừng.
#
# File này là PRODUCTION. Dev (hot reload) dùng docker-compose.dev.yml —
# project riêng "hospital_hrm_dev", không đụng tới container/volume ở đây.
# Giữ nguyên tên project: volume audit log thật là hospital_hrm_api-logs.

name: hospital_hrm

services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: hospital-hrm-api:latest
    restart: unless-stopped
    # File sau ghi đè file trước. "environment" bên dưới ghi đè cả hai, nên
    # chỉ để ở đó những giá trị cố định của container — mọi cấu hình còn lại
    # (DB_HOST, COOKIE_SECURE...) đặt trong .env.production.
    env_file:
      - path: server/.env
        required: false
      - path: server/.env.production
        required: false
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # API không mở cổng ra ngoài — chỉ nginx (web) gọi tới qua mạng nội bộ
    expose:
      - "3000"
    volumes:
      - api-logs:/app/server/logs
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  web:
    build:
      context: .
      dockerfile: client/Dockerfile
    image: hospital-hrm-web:latest
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  # Audit log của server (audit-YYYY-MM-DD.log)
  api-logs:
