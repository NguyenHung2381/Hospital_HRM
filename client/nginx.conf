# nginx cho Hospital HRM — thay vai trò Apache + .htaccess khi chạy bằng Docker.
# File này được include bên trong khối http {} của nginx.

# Lớp chống brute-force thứ 2 (ngoài loginRateLimit của Node): tối đa
# 10 request đăng nhập / phút / IP.
limit_req_zone $binary_remote_addr zone=hrm_login:10m rate=10r/m;

# File build của Vite có hash trong tên → cache lâu dài; index.html thì không cache.
map $uri $hrm_cache_control {
	~^/assets/  "public, max-age=31536000, immutable";
	default     "no-cache";
}

upstream hrm_api {
	server backend:3000;
	keepalive 16;
}

server {
	listen 8080;
	server_name _;
	server_tokens off;

	root /usr/share/nginx/html;
	index index.html;

	client_max_body_size 1m;

	gzip on;
	gzip_types text/css application/javascript application/json image/svg+xml;
	gzip_min_length 1024;

	# ── Header bảo mật (giống client/public/.htaccess) ──────────
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "DENY" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
	add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
	add_header Cache-Control $hrm_cache_control always;
	# Chỉ bật HSTS khi site đã chạy HTTPS ổn định (bỏ dấu # ở dòng dưới)
	# add_header Strict-Transport-Security "max-age=31536000" always;

	# Không phục vụ file ẩn (.htaccess, .env...)
	location ~ /\. {
		deny all;
		return 404;
	}

	# ── API ─────────────────────────────────────────────────────
	# Header bảo mật của API do helmet (Node) đặt; khai báo add_header ở đây
	# để không nhân đôi header của khối server.
	location /api/ {
		add_header X-Content-Type-Options "nosniff" always;

		proxy_pass http://hrm_api;
		proxy_http_version 1.1;
		proxy_set_header Connection "";
		proxy_set_header Host $host;
		# Ghi đè (không nối thêm) → client không giả mạo được IP gửi tới Node
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;

		# SSE (/api/subscribe): không buffer, giữ kết nối lâu
		proxy_buffering off;
		proxy_cache off;
		proxy_read_timeout 1h;
	}

	# Đăng nhập web (/api/auth/login) và cấp token API (/api/auth/token)
	location ~ ^/api/auth/(login|token)$ {
		add_header X-Content-Type-Options "nosniff" always;
		limit_req zone=hrm_login burst=5 nodelay;
		limit_req_status 429;

		proxy_pass http://hrm_api;
		proxy_http_version 1.1;
		proxy_set_header Connection "";
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	# ── SPA: mọi đường dẫn không phải file → index.html ─────────
	location / {
		try_files $uri $uri/ /index.html;
	}
}
