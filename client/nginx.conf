# nginx cho Hospital HRM — thay vai trò Apache + .htaccess khi chạy bằng Docker.
# File này được include bên trong khối http {} của nginx.
#
# HTTPS kết thúc ở reverse proxy đứng trước (https://dieuduong.bvnghean.vn →
# máy chủ :8080) — container này chỉ nhận HTTP từ proxy đó. Proxy được tin cậy
# khai báo qua biến TRUSTED_PROXIES (docker/40-trusted-proxies.sh sinh file
# dưới đây: bật real_ip → $remote_addr = IP thật người dùng, và biến
# $from_trusted_proxy).
include /tmp/nginx-trusted-proxies.conf;

# Giao thức người dùng THỰC SỰ dùng: tin X-Forwarded-Proto chỉ khi request đến
# từ proxy tin cậy; còn lại lấy giao thức của chính kết nối vào container.
map $from_trusted_proxy $fwd_proto_claimed {
	1       $http_x_forwarded_proto;
	default "";
}
map $fwd_proto_claimed $fwd_proto {
	https   https;
	http    http;
	default $scheme;
}

# HSTS chỉ gửi khi người dùng đang ở HTTPS. Giá trị rỗng = không gửi header.
map $fwd_proto $hsts {
	https   "max-age=31536000";
	default "";
}

# ─── Chống DoS / brute-force ────────────────────────────────────────────────
# Đếm theo IP THẬT người dùng (real_ip ở trên).
#   hrm_login — 10 lượt/phút cho đăng nhập + xác minh 2FA (bcrypt tốn CPU);
#               lớp thứ 2, ngoài loginRateLimit của Node.
#   hrm_api   — 30 req/s, burst 60: tải 1 trang SPA vẫn lọt, vòng lặp spam bị
#               trả 429 trước khi tới Node.
#   hrm_conn  — số kết nối SSE (/api/subscribe) đồng thời mỗi IP.
limit_req_zone $binary_remote_addr zone=hrm_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=hrm_api:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=hrm_conn:10m;
limit_req_status 429;
limit_conn_status 429;

# File build của Vite có hash trong tên → cache lâu dài; index.html thì không cache.
map $uri $hrm_cache_control {
	~^/assets/  "public, max-age=31536000, immutable";
	default     "no-cache";
}

upstream hrm_api {
	server backend:3000;
	keepalive 16;
}

server {
	listen 80;
	server_name dieuduong.bvnghean.vn localhost;
	server_tokens off;

	root /usr/share/nginx/html;
	index index.html;

	client_max_body_size 1m;
	# Chống slowloris: client gửi header/body nhỏ giọt để giữ kết nối mãi
	# (thời gian chờ GIỮA 2 lần đọc, không phải tổng thời gian).
	client_header_timeout 15s;
	client_body_timeout 30s;
	send_timeout 30s;
	keepalive_timeout 30s;

	gzip on;
	gzip_types text/css application/javascript application/json image/svg+xml;
	gzip_min_length 1024;
	gzip_proxied any;

	# Proxy tới Node — các location /api bên dưới kế thừa.
	proxy_http_version 1.1;
	proxy_set_header Connection "";
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	# GHI ĐÈ (không nối thêm): Node TRUST_PROXY=1 lấy đúng địa chỉ này
	proxy_set_header X-Forwarded-For $remote_addr;
	proxy_set_header X-Forwarded-Proto $fwd_proto;

	# ── Header bảo mật (giống client/public/.htaccess) ──────────
	add_header Strict-Transport-Security $hsts always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "DENY" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
	add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
	add_header Cache-Control $hrm_cache_control always;

	# Không phục vụ file ẩn (.htaccess, .env...)
	location ~ /\. {
		deny all;
		return 404;
	}

	# ── API ─────────────────────────────────────────────────────
	# Header bảo mật của API do helmet (Node) đặt; khai báo add_header ở đây
	# để không nhân đôi header của khối server.
	location /api/ {
		add_header X-Content-Type-Options "nosniff" always;
		limit_req zone=hrm_api burst=60 nodelay;
		proxy_pass http://hrm_api;
	}

	# Đăng nhập + xác minh OTP 2FA: giới hạn chặt hơn /api/ còn lại
	location ~ ^/api/auth/(login|2fa/verify)$ {
		add_header X-Content-Type-Options "nosniff" always;
		limit_req zone=hrm_login burst=5 nodelay;
		proxy_pass http://hrm_api;
	}

	# SSE realtime: không buffer/gzip, giữ kết nối lâu (Node ping mỗi 30s).
	location = /api/subscribe {
		add_header X-Content-Type-Options "nosniff" always;
		limit_conn hrm_conn 20;
		proxy_pass http://hrm_api;
		proxy_buffering off;
		# nginx mặc định nuốt X-Accel-* của Node → proxy HTTPS đứng trước không
		# thấy "X-Accel-Buffering: no", gom sự kiện vào bộ đệm → realtime trễ.
		proxy_pass_header X-Accel-Buffering;
		proxy_cache off;
		gzip off;
		proxy_read_timeout 1h;
	}

	# ── SPA: mọi đường dẫn không phải file → index.html ─────────
	location / {
		try_files $uri $uri/ /index.html;
	}
}
